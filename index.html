<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Muhammad Zakariyya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(to bottom, #e0e7ff, #f8fafc);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .header {
            background: #1d4ed8;
            color: white;
            padding: 35px 20px;
            text-align: center;
            position: relative;
        }

        .initials {
            width: 70px;
            height: 70px;
            background: white;
            color: #1d4ed8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 15px;
        }

        .header h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.95;
        }

        .content {
            padding: 25px 30px;
        }

        .content h2 {
            color: #1d4ed8;
            font-size: 22px;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
        }

        .bio-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 16px;
        }

        .bio-row:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: 500;
            color: #475569;
        }

        .value {
            font-weight: 600;
            color: #1e293b;
            text-align: right;
        }

        .toggle-btn {
            width: calc(100% - 60px);
            margin: 20px 30px;
            padding: 14px;
            background: #1d4ed8;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }

        .toggle-btn:hover {
            background: #1e40af;
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: #64748b;
            border-top: 1px solid #f1f5f9;
            margin-top: 10px;
        }

        /* Sembunyikan biodata awal */
        #biodata {
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Bagian Atas -->
        <div class="header">
            <div class="initials">MZ</div>
            <h1>Muhammad Zakariyya</h1>
            <p>Pelajar SMK Banjar Asri</p>
        </div>

        <!-- Isi Biodata -->
        <div class="content" id="biodata">
            <h2>Biodata Siswa</h2>
            <div class="bio-row">
                <span class="label">Nama Lengkap</span>
                <span class="value">Muhammad Zakariyya</span>
            </div>
            <div class="bio-row">
                <span class="label">Kelas</span>
                <span class="value">X TJKT 1</span>
            </div>
            <div class="bio-row">
                <span class="label">Umur</span>
                <span class="value">16 Tahun</span>
            </div>
            <div class="bio-row">
                <span class="label">Jenis Kelamin</span>
                <span class="value">Laki-laki</span>
            </div>
            <div class="bio-row">
                <span class="label">Sekolah</span>
                <span class="value">SMK Banjar Asri</span>
            </div>
        </div>

        <!-- Tombol -->
        <button class="toggle-btn" onclick="toggleBio()">Tampilkan Biodata</button>

        <!-- Footer -->
        <div class="footer">
            © 2026 Muhammad Zakariyya | Website Biodata Siswa
        </div>
    </div>

    <script>
        function toggleBio() {
            const bio = document.getElementById('biodata');
            const btn = document.querySelector('.toggle-btn');
            
            if (bio.style.display === 'block') {
                bio.style.display = 'none';
                btn.textContent = 'Tampilkan Biodata';
            } else {
                bio.style.display = 'block';
                btn.textContent = 'Sembunyikan Biodata';
            }
        }
    </script>
</body>
</html>
